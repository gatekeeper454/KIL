[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-infrastructure-layer"
version = "0.0.0"
description = "Reference implementation and incident replay for ambient KTP enforcement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
lab = ["cryptography==50.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
