declaration:
  problem: >
    KIL tests whether short-lived, identity- and authority-class-bound,
    trajectory-aware KTP state can safely reduce or withhold authority at a
    transport enforcement boundary before a consequential action reaches its
    target.
  known_limitations: >
    KIL is a reference implementation and experiment harness, not a production
    control plane. Its incident replay and current KTP context are modeled; the
    V3B-1 request-free lifecycle is accepted, but the central live enforcement
    proof, Kind/Calico validation, repetition, performance promotion, and
    independent validation remain pending. It does not prove that the modeled
    controls would have prevented the historical incident.

